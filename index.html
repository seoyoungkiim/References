<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>References</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f5f3;
      --card-bg: #ffffff;
      --text: #0e0e0e;
      --muted: #9a9a9a;
      --border: #e4e2de;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 28px;
    }

    .wordmark {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .divider { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

    .tabs { display: flex; gap: 4px; flex: 1; }

    .tab {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10.5px;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 3px;
      transition: background 0.14s, color 0.14s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: rgba(0,0,0,0.05); }
    .tab.active { background: var(--text); color: var(--bg); }
    .tab .n { margin-left: 4px; opacity: 0.45; }

    .search-wrap { margin-left: auto; flex-shrink: 0; }
    .search {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 11px;
      font-family: inherit;
      font-size: 10.5px;
      color: var(--text);
      width: 170px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search::placeholder { color: #c0beba; }
    .search:focus { border-color: var(--text); }

    main { padding: 28px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.22s cubic-bezier(.25,.46,.45,.94);
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.09);
    }

    .thumb-wrap {
      aspect-ratio: 16 / 10;
      background: var(--border);
      overflow: hidden;
      position: relative;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(.25,.46,.45,.94);
    }
    .card:hover .thumb-wrap img { transform: scale(1.04); }

    /* placeholder for no-image cards */
    .thumb-shimmer {
      position: absolute;
      inset: 0;
      background: #eae8e4;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    .thumb-shimmer span {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #bbb;
      text-transform: uppercase;
    }

    .card-info {
      padding: 9px 12px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .card-name {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-domain { font-size: 9.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

    .card[hidden] { display: none; }

    .empty {
      grid-column: 1 / -1;
      padding: 100px 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      display: none;
    }
    .empty.show { display: block; }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Refs</div>
  <div class="divider"></div>
  <div class="tabs">
    <button class="tab active" data-f="all">All <span class="n" id="n-all"></span></button>
    <button class="tab" data-f="studio">Studio <span class="n" id="n-studio"></span></button>
    <button class="tab" data-f="font">Font Foundry <span class="n" id="n-font"></span></button>
    <button class="tab" data-f="agency">Agency <span class="n" id="n-agency"></span></button>
  </div>
  <div class="search-wrap">
    <input class="search" id="q" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty" id="empty">No results</div>
  </div>
</main>

  { name:"Made Thought",        url:"https://www.madethought.com",                  c:"agency", thumb:null },
  { name:"Bttr Hlf",            url:"https://bttrhlf.com",                          c:"agency", thumb:"https://cdn.sanity.io/images/ug80ty2t/production/c418c6a35f7d6aecd5138594769990bee2adc749-1200x630.jpg?w=1200&h=630" },
  { name:"Rivermeade",          url:"https://www.rivermeade.com/portfolio",         c:"agency", thumb:null },
];

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

const grid  = document.getElementById('grid');
const empty = document.getElementById('empty');

DATA.forEach(d => {
  const a = document.createElement('a');
  a.className = 'card';
  a.dataset.c    = d.c;
  a.dataset.name = d.name.toLowerCase();
  a.href         = d.url;
  a.target       = '_blank';
  a.rel          = 'noopener noreferrer';

  const wrap = document.createElement('div');
  wrap.className = 'thumb-wrap';

  if (d.thumb) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt     = d.name;
    img.src     = d.thumb;
    img.onerror = () => {
      img.remove();
      const sh = document.createElement('div');
      sh.className = 'thumb-shimmer';
      sh.innerHTML = `<span>${host(d.url)}</span>`;
      wrap.appendChild(sh);
    };
    wrap.appendChild(img);
  } else {
    const sh = document.createElement('div');
    sh.className = 'thumb-shimmer';
    sh.innerHTML = `<span>${host(d.url)}</span>`;
    wrap.appendChild(sh);
  }

  const info = document.createElement('div');
  info.className = 'card-info';
  info.innerHTML = `<span class="card-name">${d.name}</span><span class="card-domain">${host(d.url)}</span>`;

  a.append(wrap, info);
  grid.insertBefore(a, empty);
});

document.getElementById('n-all').textContent    = DATA.length;
document.getElementById('n-studio').textContent = DATA.filter(d => d.c === 'studio').length;
document.getElementById('n-font').textContent   = DATA.filter(d => d.c === 'font').length;
document.getElementById('n-agency').textContent = DATA.filter(d => d.c === 'agency').length;

let activeFilter = 'all', query = '';

function render() {
  let vis = 0;
  grid.querySelectorAll('.card').forEach(card => {
    const ok = (activeFilter === 'all' || card.dataset.c === activeFilter)
            && (!query || card.dataset.name.includes(query));
    card.hidden = !ok;
    if (ok) vis++;
  });
  empty.classList.toggle('show', vis === 0);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    render();
  });
});

document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
</script>
</body>
</html>
