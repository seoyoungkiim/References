<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>References — Editor</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f5f3;
      --panel: #ffffff;
      --text: #0e0e0e;
      --muted: #9a9a9a;
      --border: #e4e2de;
      --accent: #0e0e0e;
      --danger: #c0392b;
      --danger-light: #fdf0ef;
      --green: #1a7a4a;
      --green-light: #edf7f2;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 300;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: 50px;
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
    }
    .wordmark {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
    }
    .badge {
      font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--border); border-radius: 2px;
      padding: 2px 6px;
    }
    .hd { width: 1px; height: 16px; background: var(--border); }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit; font-size: 10.5px; letter-spacing: 0.06em;
      cursor: pointer; border-radius: 3px;
      padding: 6px 14px; border: 1px solid transparent;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn-ghost { background: none; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); }
    .btn-solid { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-solid:hover { background: #333; }
    .btn-danger { background: none; color: var(--danger); border-color: #f0d0cd; }
    .btn-danger:hover { background: var(--danger-light); }

    /* ── LAYOUT ── */
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: 0;
    }

    /* ── LEFT: SITE LIST ── */
    .list-panel {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .list-toolbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      background: var(--panel);
      position: sticky; top: 50px; z-index: 100;
    }

    .filter-tabs { display: flex; gap: 3px; flex: 1; }
    .ftab {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 0.07em;
      color: var(--muted); padding: 4px 10px; border-radius: 3px;
      transition: background .14s, color .14s;
    }
    .ftab:hover { color: var(--text); background: rgba(0,0,0,0.04); }
    .ftab.active { background: var(--text); color: var(--bg); }
    .ftab .n { margin-left: 3px; opacity: 0.45; }

    .search-field {
      background: transparent; border: 1px solid var(--border);
      border-radius: 3px; padding: 4px 10px;
      font-family: inherit; font-size: 10.5px; color: var(--text);
      width: 150px; outline: none; transition: border-color .15s;
    }
    .search-field::placeholder { color: #c0beba; }
    .search-field:focus { border-color: var(--text); }

    .site-list { overflow-y: auto; flex: 1; }

    .cat-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted);
      padding: 14px 20px 6px;
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .site-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      transition: background .12s;
    }
    .site-row:hover { background: #fafaf8; }
    .site-row.hidden { display: none; }

    .site-thumb {
      width: 44px; height: 30px; border-radius: 2px;
      object-fit: cover; border: 1px solid var(--border);
      flex-shrink: 0; background: #eae8e4;
    }
    .site-thumb-ph {
      width: 44px; height: 30px; border-radius: 2px;
      background: linear-gradient(110deg, #eae8e4 30%, #f0eeea 50%, #eae8e4 70%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
      border: 1px solid var(--border); flex-shrink: 0;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .site-info { flex: 1; min-width: 0; }
    .site-name {
      font-size: 11.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .site-url {
      font-size: 10px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px;
    }
    .site-cat {
      font-size: 9px; letter-spacing: 0.08em; color: var(--muted);
      border: 1px solid var(--border); border-radius: 2px;
      padding: 2px 5px; flex-shrink: 0; white-space: nowrap;
    }

    .del-btn {
      background: none; border: none; cursor: pointer;
      color: #ccc; font-size: 16px; line-height: 1;
      padding: 4px; border-radius: 2px; flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    .del-btn:hover { color: var(--danger); background: var(--danger-light); }

    .empty-msg {
      padding: 40px 20px; text-align: center;
      font-size: 11px; color: var(--muted);
    }

    /* ── RIGHT: ADD FORM ── */
    .form-panel {
      display: flex; flex-direction: column;
      background: var(--panel);
      overflow-y: auto;
    }

    .form-section {
      padding: 24px 24px 0;
    }
    .form-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 18px;
    }

    .form-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 10px; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 5px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; padding: 7px 10px;
      font-family: inherit; font-size: 11.5px; color: var(--text);
      outline: none; transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--text); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 60px; font-size: 10.5px; }

    .thumb-preview {
      width: 100%; height: 120px;
      border: 1px solid var(--border); border-radius: 3px;
      object-fit: cover; background: #eae8e4;
      display: none; margin-top: 6px;
    }
    .thumb-preview.show { display: block; }

    .form-footer {
      padding: 20px 24px 24px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }
    .form-footer .btn { width: 100%; justify-content: center; font-size: 11px; }

    /* ── EXPORT SECTION ── */
    .export-section {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .export-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 12px;
    }
    .export-note {
      font-size: 10.5px; color: var(--muted); line-height: 1.5;
      margin-bottom: 14px;
    }
    .export-section .btn { width: 100%; justify-content: center; font-size: 11px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 9px 18px; border-radius: 4px;
      font-size: 11px; letter-spacing: 0.04em;
      opacity: 0; pointer-events: none;
      transition: opacity .2s; z-index: 9999;
    }
    .toast.show { opacity: 1; }

    /* ── COUNT BADGE ── */
    .count-badge {
      display: inline-flex; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px 10px;
      font-size: 10px; color: var(--muted); gap: 4px;
    }
    .count-badge strong { color: var(--text); }
  </style>
</head>
<body>

<header>
  <span class="wordmark">References</span>
  <span class="badge">Editor</span>
  <div class="hd"></div>
  <span class="count-badge"><strong id="total-count">0</strong> sites</span>
  <div class="header-right">
    <a href="references.html" class="btn btn-ghost" target="_blank">↗ View References</a>
    <button class="btn btn-solid" onclick="exportHTML()">⬇ Export references.html</button>
  </div>
</header>

<div class="layout">

  <!-- LEFT: LIST -->
  <div class="list-panel">
    <div class="list-toolbar">
      <div class="filter-tabs">
        <button class="ftab active" data-filter="all" onclick="setFilter('all', this)">All <span class="n" id="n-all"></span></button>
        <button class="ftab" data-filter="studio" onclick="setFilter('studio', this)">Studio <span class="n" id="n-studio"></span></button>
        <button class="ftab" data-filter="font" onclick="setFilter('font', this)">Font <span class="n" id="n-font"></span></button>
        <button class="ftab" data-filter="agency" onclick="setFilter('agency', this)">Agency <span class="n" id="n-agency"></span></button>
      </div>
      <input class="search-field" type="text" placeholder="Search…" oninput="setSearch(this.value)">
    </div>
    <div class="site-list" id="site-list"></div>
  </div>

  <!-- RIGHT: FORM + EXPORT -->
  <div class="form-panel">

    <div class="form-section">
      <div class="form-title">Add New Site</div>

      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Pentagram">
      </div>

      <div class="form-group">
        <label>URL *</label>
        <input type="url" id="f-url" placeholder="https://">
      </div>

      <div class="form-group">
        <label>Category *</label>
        <select id="f-cat">
          <option value="studio">Studio</option>
          <option value="font">Font Foundry</option>
          <option value="agency">Branding Agency</option>
        </select>
      </div>

      <div class="form-group">
        <label>Thumbnail URL <span style="font-size:9px;text-transform:none;letter-spacing:0">(optional)</span></label>
        <input type="url" id="f-thumb" placeholder="https://… (og:image URL)" oninput="previewThumb(this.value)">
        <img id="thumb-preview" class="thumb-preview" alt="preview">
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-solid" onclick="addSite()">+ Add Site</button>
    </div>

    <div class="export-section">
      <div class="export-title">Export</div>
      <p class="export-note">모든 변경사항은 이 페이지를 새로고침하면 초기화됩니다. 작업 후 반드시 Export하여 references.html을 업데이트하세요.</p>
      <button class="btn btn-ghost" onclick="exportHTML()">⬇ Download references.html</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

// ── STATE ────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let searchQuery  = '';

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

// ── RENDER LIST ──────────────────────────────────────────────────────────────
function renderList() {
  const container = document.getElementById('site-list');
  container.innerHTML = '';

  const cats = [
    { key: 'studio', label: 'Studio' },
    { key: 'font',   label: 'Font Foundry' },
    { key: 'agency', label: 'Branding Agency' },
  ];

  let totalVisible = 0;

  cats.forEach(({ key, label }) => {
    const items = DATA.filter(d => {
      if (d.c !== key) return false;
      if (activeFilter !== 'all' && d.c !== activeFilter) return false;
      if (searchQuery && !d.name.toLowerCase().includes(searchQuery)) return false;
      return true;
    });

    if (activeFilter !== 'all' && activeFilter !== key) return;

    const header = document.createElement('div');
    header.className = 'cat-label';
    header.textContent = label;
    container.appendChild(header);

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'No sites';
      container.appendChild(empty);
      return;
    }

    items.forEach(d => {
      totalVisible++;
      const idx = DATA.indexOf(d);
      const row = document.createElement('div');
      row.className = 'site-row';

      if (d.thumb) {
        const img = document.createElement('img');
        img.className = 'site-thumb';
        img.src = d.thumb;
        img.alt = d.name;
        img.onerror = () => {
          img.replaceWith(makeThumbPh());
        };
        row.appendChild(img);
      } else {
        row.appendChild(makeThumbPh());
      }

      const info = document.createElement('div');
      info.className = 'site-info';
      info.innerHTML = `<div class="site-name">${d.name}</div><div class="site-url">${host(d.url)}</div>`;
      row.appendChild(info);

      const catBadge = document.createElement('span');
      catBadge.className = 'site-cat';
      catBadge.textContent = { studio:'Studio', font:'Font', agency:'Agency' }[d.c];
      row.appendChild(catBadge);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.title = 'Delete';
      del.innerHTML = '×';
      del.onclick = () => deleteSite(idx);
      row.appendChild(del);

      container.appendChild(row);
    });
  });

  // Update counts
  document.getElementById('n-all').textContent    = DATA.length;
  document.getElementById('n-studio').textContent = DATA.filter(d => d.c==='studio').length;
  document.getElementById('n-font').textContent   = DATA.filter(d => d.c==='font').length;
  document.getElementById('n-agency').textContent = DATA.filter(d => d.c==='agency').length;
  document.getElementById('total-count').textContent = DATA.length;
}

function makeThumbPh() {
  const ph = document.createElement('div');
  ph.className = 'site-thumb-ph';
  return ph;
}

// ── FILTER & SEARCH ──────────────────────────────────────────────────────────
function setFilter(key, el) {
  activeFilter = key;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function setSearch(val) {
  searchQuery = val.toLowerCase();
  renderList();
}

// ── ADD SITE ─────────────────────────────────────────────────────────────────
function addSite() {
  const name  = document.getElementById('f-name').value.trim();
  const url   = document.getElementById('f-url').value.trim();
  const cat   = document.getElementById('f-cat').value;
  const thumb = document.getElementById('f-thumb').value.trim() || null;

  if (!name) { showToast('이름을 입력해주세요'); return; }
  if (!url)  { showToast('URL을 입력해주세요'); return; }
  if (!url.startsWith('http')) { showToast('URL은 https://로 시작해야 해요'); return; }

  DATA.push({ name, url, c: cat, thumb: thumb || null });
  renderList();

  // Clear form
  document.getElementById('f-name').value  = '';
  document.getElementById('f-url').value   = '';
  document.getElementById('f-thumb').value = '';
  document.getElementById('thumb-preview').classList.remove('show');

  showToast(`"${name}" 추가됨`);
}

// ── DELETE SITE ──────────────────────────────────────────────────────────────
function deleteSite(idx) {
  const name = DATA[idx].name;
  DATA.splice(idx, 1);
  renderList();
  showToast(`"${name}" 삭제됨`);
}

// ── THUMB PREVIEW ─────────────────────────────────────────────────────────────
function previewThumb(url) {
  const img = document.getElementById('thumb-preview');
  if (url && url.startsWith('http')) {
    img.src = url;
    img.classList.add('show');
  } else {
    img.classList.remove('show');
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

    .empty-state { display: none; grid-column: 1/-1; text-align: center; padding: 80px 20px; font-size: 12px; color: var(--muted); }
    .empty-state.show { display: block; }
    .editor-link { font-size: 10px; color: var(--muted); text-decoration: none; margin-left: auto; }
    .editor-link:hover { color: var(--text); }
  </style>
</head>
<body>
<header>
  <span class="wordmark">References</span>
  <div class="divider"></div>
  <div class="tabs">
    <button class="tab active" data-filter="all" onclick="setFilter('all',this)">All<span class="n" id="n-all"></span></button>

  </div>
  <div class="search-wrap"><input class="search" type="text" placeholder="Search…" oninput="setSearch(this.value)"></div>

</header>
<main>
  <div class="grid" id="grid">
    <div class="empty-state" id="empty">No results</div>
  </div>
</main>
<script>
const DATA = [
${dataStr}
];
function host(u){try{return new URL(u).hostname.replace(/^www\\./,'')}catch{return u}}
const grid=document.getElementById('grid'),empty=document.getElementById('empty');
DATA.forEach(d=>{
  const a=document.createElement('a');
  a.className='card'; a.dataset.c=d.c; a.dataset.name=d.name.toLowerCase();

  const wrap=document.createElement('div'); wrap.className='thumb-wrap';
  if(d.thumb){const img=document.createElement('img');img.loading='lazy';img.alt=d.name;img.src=d.thumb;img.onerror=()=>{img.remove();const sh=document.createElement('div');sh.className='thumb-shimmer';sh.innerHTML=\`<span>\${host(d.url)}</span>\`;wrap.appendChild(sh)};wrap.appendChild(img)}
  else{const sh=document.createElement('div');sh.className='thumb-shimmer';sh.innerHTML=\`<span>\${host(d.url)}</span>\`;wrap.appendChild(sh)}

document.getElementById('n-all').textContent=DATA.length;

function setFilter(k,el){af=k;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function setSearch(v){q=v.toLowerCase();render()}
<\/script>

</html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'references.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('references.html 다운로드됨');
}
